<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="todo-card">

            <h1>My To Do List 📋</h1>

            <!-- Form Input Tugas -->
            <form id="todo-form">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Tambahkan to do list"
                    autocomplete="off"
                >

                <button type="submit" id="add-button">
                    tambah
                </button>
            </form>

            <!-- Pesan Peringatan -->
            <p id="warning"></p>

            <!-- Daftar Tugas -->
            <ul id="todo-list"></ul>

            <!-- Statistik Tugas -->
            <div class="statistics">
                <div class="stat-item">
                    <span>Total Tugas</span>
                    <strong id="total-tasks">0</strong>
                </div>

                <div class="stat-item">
                    <span>Selesai</span>
                    <strong id="completed-tasks">0</strong>
                </div>

                <div class="stat-item">
                    <span>Belum Selesai</span>
                    <strong id="pending-tasks">0</strong>
                </div>
            </div>

        </div>
    </div>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>
</html>
